name: Build NAR Releases
on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken board must not cancel the assets for the other two
      fail-fast: false
      matrix:
        include:
          - name: Rpi4
            type: toplevel
            attr: .#nixosConfigurations.Rpi4.config.system.build.toplevel
          - name: Rpi5
            type: toplevel
            attr: .#nixosConfigurations.Rpi5.config.system.build.toplevel
          - name: Nanopi-neo3
            type: toplevel
            attr: .#nixosConfigurations.Nanopi-neo3.config.system.build.toplevel
          - name: Rpi4
            type: sdImage
            attr: .#packages.aarch64-linux.Rpi4
          - name: Rpi5
            type: sdImage
            attr: .#packages.aarch64-linux.Rpi5
          - name: Nanopi-neo3
            type: sdImage
            attr: .#packages.aarch64-linux.Nanopi-neo3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            substituters = https://nix-community.cachix.org https://cache.nixos.org
            trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            require-sigs = false

      - name: Setup nixbuild.net SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host eu.nixbuild.net
            PubkeyAcceptedKeyTypes ssh-ed25519
            ServerAliveInterval 60
            IPQoS throughput
            IdentityFile ~/.ssh/id_ed25519
          EOF
          echo "eu.nixbuild.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPIQCZc54poJ8vqawd8TraNryQeJnvH1eLpIDgbiqymM" >> ~/.ssh/known_hosts
          echo "${{ secrets.NIXBUILD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build
        run: |
          # stdout carries the --json result the later steps parse, so it goes
          # straight to the file with nothing else in that stream. stderr is
          # teed so a failure leaves something to grep.
          nix build \
            --accept-flake-config \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net \
            --json \
            ${{ matrix.attr }} > build-result.json 2> >(tee build.err >&2) || status=$?
          if [ -n "${status:-}" ]; then
            sleep 1
            # nixbuild.net does not implement getBuildLogExact, so `nix log`
            # against that store always fails. It does print its own build id,
            # which is what the nixbuild.net dashboard indexes logs by.
            for id in $(grep -oE 'build [0-9]+' build.err | awk '{print $2}' | sort -u); do
              echo "::error::builder failed - full log is nixbuild.net build $id"
            done
            exit "$status"
          fi
          echo "--- build-result.json ---"
          cat build-result.json
          echo

      - name: Export closure to NAR (toplevel)
        if: matrix.type == 'toplevel'
        run: |
          set -o pipefail
          # jq -e fails the step on a null or missing out path. Without it an
          # empty closure gzips to ~20 bytes and uploads as a plausible-looking
          # asset that every device then fails to import.
          TOPLEVEL=$(jq -er '.[0].outputs.out' build-result.json)
          nix-store --store ssh-ng://eu.nixbuild.net --export $(nix-store --store ssh-ng://eu.nixbuild.net --query --requisites "$TOPLEVEL") | gzip > ${{ matrix.name }}-toplevel.nar.gz
          size=$(stat -c %s ${{ matrix.name }}-toplevel.nar.gz)
          [ "$size" -gt 1048576 ] || { echo "::error::NAR is only $size bytes"; exit 1; }

      - name: Copy and compress sdImage
        if: matrix.type == 'sdImage'
        run: |
          set -o pipefail
          OUTPUT=$(jq -er '.[0].outputs.out' build-result.json)
          IMG_REL=$(nix store ls --store ssh-ng://eu.nixbuild.net --recursive "$OUTPUT" | grep '\.img$' | awk '{print $NF}' | head -1)
          [ -n "$IMG_REL" ] || { echo "::error::no .img found in $OUTPUT"; exit 1; }
          nix store cat --store ssh-ng://eu.nixbuild.net "$OUTPUT/$IMG_REL" | gzip > ${{ matrix.name }}.img.gz
          size=$(stat -c %s ${{ matrix.name }}.img.gz)
          [ "$size" -gt 1048576 ] || { echo "::error::image is only $size bytes"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.type }}
          path: |
            ${{ matrix.name }}-toplevel.nar.gz
            ${{ matrix.name }}.img.gz
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: build
    # needs: build alone would skip this job whenever any matrix leg fails;
    # upload whatever assets did build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./nars

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(./nars/*/*.nar.gz ./nars/*/*.img.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no assets were produced by any matrix leg"
            exit 1
          fi
          gh release upload ${{ github.event.release.tag_name }} --clobber "${assets[@]}"
