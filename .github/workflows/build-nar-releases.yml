name: Build NAR Releases
on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken board must not cancel the assets for the other two
      fail-fast: false
      matrix:
        include:
          - name: Rpi4
            type: toplevel
            attr: .#nixosConfigurations.Rpi4.config.system.build.toplevel
          - name: Rpi5
            type: toplevel
            attr: .#nixosConfigurations.Rpi5.config.system.build.toplevel
          - name: Nanopi-neo3
            type: toplevel
            attr: .#nixosConfigurations.Nanopi-neo3.config.system.build.toplevel
          - name: Rpi4
            type: sdImage
            attr: .#packages.aarch64-linux.Rpi4
          - name: Rpi5
            type: sdImage
            attr: .#packages.aarch64-linux.Rpi5
          - name: Nanopi-neo3
            type: sdImage
            attr: .#packages.aarch64-linux.Nanopi-neo3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          extra_nix_config: |
            substituters = https://nix-community.cachix.org https://cache.nixos.org
            trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            require-sigs = false

      - name: Setup nixbuild.net SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host eu.nixbuild.net
            PubkeyAcceptedKeyTypes ssh-ed25519
            ServerAliveInterval 60
            IPQoS throughput
            IdentityFile ~/.ssh/id_ed25519
          EOF
          echo "eu.nixbuild.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPIQCZc54poJ8vqawd8TraNryQeJnvH1eLpIDgbiqymM" >> ~/.ssh/known_hosts
          echo "${{ secrets.NIXBUILD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build
        run: |
          set -o pipefail
          # 2>&1 > file  sends stderr down the pipe and stdout to the file, so
          # progress stays live in the job log while build.err keeps a copy
          if nix build \
            --accept-flake-config \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net \
            --json \
            ${{ matrix.attr }} 2>&1 > build-result.json | tee build.err
          then
            exit 0
          else
            # nixbuild.net reports the builder's exit code but not its output,
            # so pull the log for every derivation the error names
            grep -oE "/nix/store/[a-z0-9]{32}-[^']*\.drv" build.err | sort -u | while read -r drv; do
              echo "::group::nix log $drv"
              nix log --store ssh-ng://eu.nixbuild.net "$drv" || echo "(no log available on the builder)"
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Export closure to NAR (toplevel)
        if: matrix.type == 'toplevel'
        run: |
          TOPLEVEL=$(jq -r '.[0].outputs.out' build-result.json)
          nix-store --store ssh-ng://eu.nixbuild.net --export $(nix-store --store ssh-ng://eu.nixbuild.net --query --requisites $TOPLEVEL) | gzip > ${{ matrix.name }}-toplevel.nar.gz

      - name: Copy and compress sdImage
        if: matrix.type == 'sdImage'
        run: |
          OUTPUT=$(jq -r '.[0].outputs.out' build-result.json)
          IMG_REL=$(nix store ls --store ssh-ng://eu.nixbuild.net --recursive $OUTPUT | grep '\.img$' | awk '{print $NF}' | head -1)
          nix store cat --store ssh-ng://eu.nixbuild.net "$OUTPUT/$IMG_REL" | gzip > ${{ matrix.name }}.img.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.type }}
          path: |
            ${{ matrix.name }}-toplevel.nar.gz
            ${{ matrix.name }}.img.gz
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: build
    # needs: build would skip this job when any matrix leg fails; upload
    # whatever assets did build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./nars

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(./nars/*/*.nar.gz ./nars/*/*.img.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No assets were produced by any matrix leg" >&2
            exit 1
          fi
          gh release upload ${{ github.event.release.tag_name }} "${assets[@]}"
